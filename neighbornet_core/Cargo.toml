[package]
name = "neighbornet_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "neighbornet_node"
path = "src/bin/node.rs"

[dependencies]
reticulum-rs = "0.11.0"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
socket2 = "0.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.8"
