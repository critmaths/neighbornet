name: Multi-Platform CI & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS X64 BUILD (Desktop App + Rust Core DLL)
  # ============================================================================
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Core Tests
        run: cargo test --verbose
        working-directory: neighbornet_core

      - name: Compile Rust Core DLL (Release)
        run: cargo build --release
        working-directory: neighbornet_core

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Dependencies
        run: flutter pub get
        working-directory: neighbornet_app

      - name: Copy Rust DLL for Flutter Tests
        shell: pwsh
        run: Copy-Item neighbornet_core/target/release/neighbornet_core.dll neighbornet_app/ -Force

      - name: Flutter Unit & Widget Tests
        run: flutter test
        working-directory: neighbornet_app

      - name: Build Flutter Windows Desktop (Release)
        run: flutter build windows --release
        working-directory: neighbornet_app

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/NeighborNet-Windows-x64
          Copy-Item -Recurse -Force neighbornet_app/build/windows/x64/runner/Release/* dist/NeighborNet-Windows-x64/
          Copy-Item -Force neighbornet_core/target/release/neighbornet_core.dll dist/NeighborNet-Windows-x64/
          Copy-Item -Force COLLAPSE_SURVIVAL_MANUAL.md dist/NeighborNet-Windows-x64/
          Copy-Item -Force README.md dist/NeighborNet-Windows-x64/
          Compress-Archive -Path dist/NeighborNet-Windows-x64/* -DestinationPath dist/NeighborNet-Windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeighborNet-Windows-x64
          path: dist/NeighborNet-Windows-x64.zip

  # ============================================================================
  # 2. LINUX X64 BUILD (Desktop App + Headless Relay Node)
  # ============================================================================
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Core Tests & Build
        run: |
          cargo test --verbose
          cargo build --release --all-targets
        working-directory: neighbornet_core

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Dependencies & Tests
        run: |
          cp neighbornet_core/target/release/libneighbornet_core.so neighbornet_app/
          sudo cp neighbornet_core/target/release/libneighbornet_core.so /usr/local/lib/
          sudo ldconfig
          cd neighbornet_app
          flutter pub get
          flutter test

      - name: Build Flutter Linux Desktop (Release)
        run: flutter build linux --release
        working-directory: neighbornet_app

      - name: Package Linux Release Archive
        run: |
          mkdir -p dist/NeighborNet-Linux-x64
          cp -r neighbornet_app/build/linux/x64/release/bundle/* dist/NeighborNet-Linux-x64/ || true
          cp neighbornet_core/target/release/neighbornet_node dist/NeighborNet-Linux-x64/
          cp -r scripts dist/NeighborNet-Linux-x64/
          cp Dockerfile docker-compose.yml COLLAPSE_SURVIVAL_MANUAL.md README.md dist/NeighborNet-Linux-x64/
          tar -czvf dist/NeighborNet-Linux-x64.tar.gz -C dist/NeighborNet-Linux-x64 .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeighborNet-Linux-x64
          path: dist/NeighborNet-Linux-x64.tar.gz

  # ============================================================================
  # 3. RASPBERRY PI / LINUX ARM64 BUILD (Headless Solar Relay Node)
  # ============================================================================
  build-rpi-arm64:
    name: Build Raspberry Pi ARM64 Relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Cross-compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Headless Relay for ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu --bin neighbornet_node
        working-directory: neighbornet_core

      - name: Package Raspberry Pi ARM64 Archive
        run: |
          mkdir -p dist/NeighborNet-Relay-RaspberryPi-arm64
          cp neighbornet_core/target/aarch64-unknown-linux-gnu/release/neighbornet_node dist/NeighborNet-Relay-RaspberryPi-arm64/
          cp -r scripts dist/NeighborNet-Relay-RaspberryPi-arm64/
          cp Dockerfile docker-compose.yml COLLAPSE_SURVIVAL_MANUAL.md README.md dist/NeighborNet-Relay-RaspberryPi-arm64/
          tar -czvf dist/NeighborNet-Relay-RaspberryPi-arm64.tar.gz -C dist/NeighborNet-Relay-RaspberryPi-arm64 .

      - name: Upload Raspberry Pi ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeighborNet-Relay-RaspberryPi-arm64
          path: dist/NeighborNet-Relay-RaspberryPi-arm64.tar.gz

  # ============================================================================
  # 4. MACOS UNIVERSAL BUILD (Desktop App + Rust Core dylib)
  # ============================================================================
  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Core Tests & Build
        run: |
          cargo test --verbose
          cargo build --release
        working-directory: neighbornet_core

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Dependencies & Tests
        run: |
          cp neighbornet_core/target/release/libneighbornet_core.dylib neighbornet_app/
          sudo cp neighbornet_core/target/release/libneighbornet_core.dylib /usr/local/lib/ || true
          cd neighbornet_app
          flutter pub get
          flutter test

      - name: Build Flutter macOS Desktop (Release)
        run: flutter build macos --release
        working-directory: neighbornet_app

      - name: Package macOS Release Archive
        run: |
          mkdir -p dist/NeighborNet-macOS
          cp -r neighbornet_app/build/macos/Build/Products/Release/NeighborNet.app dist/NeighborNet-macOS/ || true
          cp neighbornet_core/target/release/libneighbornet_core.dylib dist/NeighborNet-macOS/ || true
          cp COLLAPSE_SURVIVAL_MANUAL.md README.md dist/NeighborNet-macOS/
          ditto -c -k --sequesterRsrc --keepParent dist/NeighborNet-macOS dist/NeighborNet-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeighborNet-macOS
          path: dist/NeighborNet-macOS.zip

  # ============================================================================
  # 5. GITHUB RELEASES PUBLISHER
  # ============================================================================
  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-windows, build-linux, build-rpi-arm64, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeighborNet-Windows-x64
          path: release-artifacts

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeighborNet-Linux-x64
          path: release-artifacts

      - name: Download Raspberry Pi ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeighborNet-Relay-RaspberryPi-arm64
          path: release-artifacts

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: NeighborNet-macOS
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
