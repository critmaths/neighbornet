name: Multi-Platform CI & Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS X64 BUILD (Desktop App + Headless Daemon + Installer)
  # ============================================================================
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          version: '6.2.2'

      - name: Run Windows Release Packaging Script
        shell: pwsh
        run: |
          .\scripts\package_windows_release.ps1

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: NeighborNet-Windows-x64-Portable
          path: dist/NeighborNet_v*.zip

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeighborNet-Windows-x64-Setup
          path: dist/NeighborNet_Setup_*.exe

  # ============================================================================
  # 2. ANDROID BUILD (Universal APK + Split ABI APKs + Rust NDK Core)
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Core Libraries for Android
        working-directory: neighbornet_core
        run: |
          mkdir -p ../neighbornet_app/android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../neighbornet_app/android/app/src/main/jniLibs build --release

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Flutter Dependencies
        working-directory: neighbornet_app
        run: flutter pub get

      - name: Build Universal Release APK
        working-directory: neighbornet_app
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        working-directory: neighbornet_app
        run: flutter build apk --release --split-per-abi

      - name: Stage Android Artifacts
        run: |
          mkdir -p dist
          cp neighbornet_app/build/app/outputs/flutter-apk/app-release.apk dist/NeighborNet-Android-Universal.apk
          cp neighbornet_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/NeighborNet-Android-arm64-v8a.apk || true
          cp neighbornet_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/NeighborNet-Android-armeabi-v7a.apk || true

      - name: Upload Android Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: NeighborNet-Android-Universal-APK
          path: dist/NeighborNet-Android-Universal.apk

      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: NeighborNet-Android-arm64-v8a-APK
          path: dist/NeighborNet-Android-arm64-v8a.apk

  # ============================================================================
  # 3. LINUX X64 BUILD (Desktop App + Headless Relay Node)
  # ============================================================================
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Core Tests & Build
        run: |
          cargo test --verbose
          cargo build --release --all-targets
        working-directory: neighbornet_core

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Dependencies & Tests
        run: |
          cp neighbornet_core/target/release/libneighbornet_core.so neighbornet_app/
          sudo cp neighbornet_core/target/release/libneighbornet_core.so /usr/local/lib/
          sudo ldconfig
          cd neighbornet_app
          flutter pub get
          flutter test

      - name: Build Flutter Linux Desktop (Release)
        run: flutter build linux --release
        working-directory: neighbornet_app

      - name: Package Linux Release Archive
        run: |
          mkdir -p dist/NeighborNet-Linux-x64
          cp -r neighbornet_app/build/linux/x64/release/bundle/* dist/NeighborNet-Linux-x64/ || true
          cp neighbornet_core/target/release/neighbornet_node dist/NeighborNet-Linux-x64/
          cp -r scripts dist/NeighborNet-Linux-x64/
          cp README.md dist/NeighborNet-Linux-x64/
          tar -czvf dist/NeighborNet-Linux-x64.tar.gz -C dist/NeighborNet-Linux-x64 .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeighborNet-Linux-x64
          path: dist/NeighborNet-Linux-x64.tar.gz

  # ============================================================================
  # 4. RASPBERRY PI / LINUX ARM64 BUILD (Headless Solar Relay Node)
  # ============================================================================
  build-rpi-arm64:
    name: Build Raspberry Pi ARM64 Relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Cross-compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Headless Relay for ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu --bin neighbornet_node
        working-directory: neighbornet_core

      - name: Package Raspberry Pi ARM64 Archive
        run: |
          mkdir -p dist/NeighborNet-Relay-RaspberryPi-arm64
          cp neighbornet_core/target/aarch64-unknown-linux-gnu/release/neighbornet_node dist/NeighborNet-Relay-RaspberryPi-arm64/
          cp -r scripts dist/NeighborNet-Relay-RaspberryPi-arm64/
          cp README.md dist/NeighborNet-Relay-RaspberryPi-arm64/
          tar -czvf dist/NeighborNet-Relay-RaspberryPi-arm64.tar.gz -C dist/NeighborNet-Relay-RaspberryPi-arm64 .

      - name: Upload Raspberry Pi ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeighborNet-Relay-RaspberryPi-arm64
          path: dist/NeighborNet-Relay-RaspberryPi-arm64.tar.gz

  # ============================================================================
  # 5. GITHUB RELEASES PUBLISHER
  # ============================================================================
  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-windows, build-android, build-linux, build-rpi-arm64]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Consolidate Release Assets & Generate Checksums
        run: |
          mkdir -p release-assets
          find release-downloads -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.apk" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "Prepared release assets:"
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
